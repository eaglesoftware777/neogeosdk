CURRENT_GAME=maiya

# ROM budgets (tools/rom_budget.py, "make GAME=maiya budget"): the build
# fails if a ROM outgrows its budget. Bytes; K = KiB, M = MiB. Usage when set:
# P 238,636 (91%)  C 2,072,704 (25%)  S 96,064 (84%)  M 8,204 (50%)  V 7,973,632 (95%)
BUDGET_P=256K
# The C chips hold 8 MiB (C1 and C2, 4 MiB each); the art had filled 2.
BUDGET_C=8M
BUDGET_S=112K
BUDGET_M=16K
BUDGET_V=8M
