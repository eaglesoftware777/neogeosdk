# Auto-generated by artbox/gen_assets_cfg.py
# Regenerated on each make art run.

[rule:cat_backgrounds]
palette_banks = 8
match_category = backgrounds
pattern = *.png
mode = screen
category = backgrounds
# Backdrops are drawn with the vertical shrink below, so the square canvas
# they are stored in covers a wide rectangle on the screen.  fit = crop
# fills that rectangle edge to edge and trims the overhang; contain would
# keep the whole picture but leave transparent bands across the backdrop.
fit = crop
anchor = center
target_width = 256
target_height = 256
display_shrink_y = 175
dither = ordered
contrast = 1.20
saturation = 1.25
sharpen_radius = 1.2
sharpen_percent = 100
sharpen_threshold = 2
kmeans_samples = 16384
kmeans_iters = 35
note = background layer or multi-level backdrop

[rule:cat_sky_planes]
match_category = characters
pattern = sprite_p*_plane.png
mode = sprite
category = characters
# Sky Lance's player craft, drawn about 28x40 in the playfield.  Imported
# at the 128 ceiling it arrives 90x128 and the sprite chip then throws
# three pixels in four away to fit the playfield - and what it throws away
# is a dither the quantiser chose for pixels it thought were final, which
# is why the ship read as a smear of colour rather than a plane.  Import
# it at the size it is drawn and there is nothing left to throw away.
fit = pad
anchor = bottom-center
target_width = 40
target_height = 40
dither = none
contrast = 1.00
saturation = 1.05
sharpen_radius = 0.0
sharpen_percent = 0
sharpen_threshold = 0
kmeans_samples = 2048
kmeans_iters = 16
halo_strip = true
halo_luma_threshold = 220
note = player craft, imported at playfield size

[rule:cat_characters]
match_category = characters
pattern = *.png
mode = sprite
category = characters
# 256, deliberately, though the demo never draws one above half size.
#
# Importing them at the size they are drawn would be sharper - it is what
# cat_sky_planes does, and the tile-stride plumbing that makes it
# possible is in place now.  Two attempts at it still came back with the
# char-select portraits and the NPC chapter rendering wrongly, in ways
# that survived fixing the stride and the draw scale, so something else
# in the demo's binding still assumes a 16-tile canvas.  Until that is
# found, this stays where the artwork is known good.
fit = pad
anchor = bottom-center
target_width = 256
target_height = 256
dither = none
contrast = 1.00
saturation = 1.05
sharpen_radius = 0.0
sharpen_percent = 0
sharpen_threshold = 0
kmeans_samples = 4096
kmeans_iters = 20
halo_strip = true
halo_luma_threshold = 220
note = 16x16 character sprite sheet

