[rule:cat_screens]
palette_banks = 4
match_category = screens
pattern = *.png
mode = screen
category = screens
# Drawn with the same vertical shrink as a backdrop.  These hold a figure
# against a plain field with a wide margin, so filling the screen and
# trimming the overhang costs only margin.
fit = crop
anchor = center
target_width = 256
target_height = 256
display_shrink_y = 175
dither = ordered
contrast = 1.20
saturation = 1.30
sharpen_radius = 1.5
sharpen_percent = 150
sharpen_threshold = 2
kmeans_samples = 16384
kmeans_iters = 35
note = full screen scenes

[rule:cat_titles]
palette_banks = 8
match_category = titles
pattern = *.png
mode = screen
category = titles
# Title art runs to its own edges - a logo that fills the frame, a portrait
# poster - so there is no margin to spend and cropping would cut into the
# artwork.  Fitting the whole picture instead leaves the backdrop showing
# down either side, which is what a correctly proportioned picture on a
# wider screen is supposed to look like.
fit = contain
anchor = center
target_width = 256
target_height = 256
display_shrink_y = 175
dither = ordered
contrast = 1.15
saturation = 1.20
sharpen_radius = 1.0
sharpen_percent = 100
sharpen_threshold = 1
kmeans_samples = 16384
kmeans_iters = 35
note = title and logo screens

