[rule:legacy_screens]
pattern = [0-9].png
mode = screen
category = background
fit = crop
anchor = center
target_width = 256
target_height = 256
dither = floyd
contrast = 1.20
saturation = 1.30
sharpen_radius = 1.5
sharpen_percent = 150
sharpen_threshold = 2
kmeans_samples = 8192
kmeans_iters = 25
note = legacy full-screen scene page

[rule:sprite_parts]
pattern = sprite_*.png
mode = sprite
category = main_character
fit = pad
anchor = bottom-center
target_width = 256
target_height = 256
dither = none
contrast = 1.00
saturation = 1.05
sharpen_radius = 0.0
sharpen_percent = 0
sharpen_threshold = 0
kmeans_samples = 2048
kmeans_iters = 10
note = sprite page padded with transparency for chained Neo Geo strips

