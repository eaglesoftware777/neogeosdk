# ============================================================
# Category-based rules (match_category = subdir name)
# These take priority over legacy filename-only rules.
# ============================================================

[rule:cat_backgrounds]
match_category = backgrounds
pattern = *.png
mode = screen
category = backgrounds
fit = contain
anchor = center
target_width = 256
target_height = 256
dither = floyd
contrast = 1.20
saturation = 1.25
sharpen_radius = 1.2
sharpen_percent = 100
sharpen_threshold = 2
kmeans_samples = 16384
kmeans_iters = 35
note = background layer or multi-level backdrop

[rule:cat_characters]
match_category = characters
pattern = *.png
mode = sprite
category = characters
fit = pad
anchor = bottom-center
target_width = 256
target_height = 256
dither = none
contrast = 1.00
saturation = 1.05
sharpen_radius = 0.0
sharpen_percent = 0
sharpen_threshold = 0
kmeans_samples = 4096
kmeans_iters = 20
note = 16x16 character sprite sheet

[rule:cat_effects]
match_category = effects
pattern = *.png
